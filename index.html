<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3つの かずの ひきざん ふりかえり</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f8ff;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#26384a}main{max-width:860px;margin:auto;padding:18px}h1{text-align:center;font-size:clamp(30px,5vw,43px);line-height:1.45}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 20px #18344b15}h2{font-size:clamp(26px,4vw,34px);margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}button{appearance:none;background:#fff;border:3px solid #b7d6ed;border-radius:18px;padding:18px 14px;min-height:100px;font:700 clamp(25px,3.6vw,33px)/1.55 -apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#23384b;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}button:active{background:#e4f5ff}#result{background:#fff8d9;padding:22px;border-radius:18px;font-size:clamp(29px,4.5vw,39px);font-weight:700;line-height:1.9}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.controls button{min-height:76px;font-size:clamp(21px,3vw,26px)}.hint{font-size:21px;line-height:1.7;text-align:center}section[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}button{min-height:82px}main{padding:12px}.card{padding:17px}}
</style></head><body><main><h1>🔢 3つの かずの ひきざん<br>ふりかえり</h1><section class="card" id="step1"><h2>① なにを ふりかえる？</h2><div class="grid" id="first"><button type="button" data-choice="0">💡 わかったこと</button><button type="button" data-choice="1">👀 きづいたこと</button><button type="button" data-choice="2">😊 できたこと</button><button type="button" data-choice="3">🌱 もっと しりたいこと</button></div></section><section class="card" id="step2" hidden><h2 id="question">② えらんでね</h2><div class="grid" id="second"></div><div class="controls"><button id="back1">↩ もどる</button></div></section><section class="card" id="step3" hidden><h2>③ ふりかえりが できたよ！</h2><p class="hint">この ぶんを のーとに うつそう ✏️</p><div id="result"></div><div class="controls"><button id="voice">🔊 よんでみる</button><button id="back2">↩ えらびなおす</button><button id="home">🏠 はじめから</button></div></section></main><script>
(function(){'use strict';
const items=[{"title":"💡 わかったこと","question":"② なにが わかった？","choices":[["3つの かずは まえから じゅんばんに ひく","3つの かずの ひきざんは、まえから じゅんばんに ひくと こたえが でることが わかりました。"],["2かい へった ときも 1つの しきに できる","かずが 2かい へった ときも、1つの しきに かいて けいさんできることが わかりました。"],["はじめに 1かい ひいてから また ひく","はじめの かずから 1かい ひいて、その こたえから もう 1かい ひくと わかりました。"],["のこった かずが こたえに なる","かずが 2かい へった あとに、のこった かずが こたえに なると わかりました。"]]},{"title":"👀 きづいたこと","question":"② なにに きづいた？","choices":[["たしざんと おなじように 1つの しきに できる","3つの かずの ひきざんも、たしざんと おなじように 1つの しきに できることに きづきました。"],["えを みると へった かずが わかる","えを よく みると、なんびきずつ へったのか わかることに きづきました。"],["とちゅうの こたえを つかうと けいさんしやすい","はじめに ひいた こたえを つかうと、つぎの けいさんが しやすいことに きづきました。"],["3つの かずでも ひきざんが できる","3つの かずが でてきても、じゅんばんに ひけば こたえが でることに きづきました。"]]},{"title":"😊 できたこと","question":"② なにが できた？","choices":[["3つの かずを じゅんばんに ひいた","3つの かずを まえから じゅんばんに ひいて、こたえを だすことが できました。"],["10−3−2の しきで こたえを だした","10−3−2の しきを かいて、こたえが 5に なることを たしかめられました。"],["えを みて ひきざんの しきを かいた","えを みて、3つの かずを つかった ひきざんの しきを かくことが できました。"],["とちゅうの こたえを つかって けいさんした","はじめに ひいた こたえから、もう 1かい ひいて けいさんできました。"]]},{"title":"🌱 もっと しりたいこと","question":"② もっと なにを しりたい？","choices":[["ほかの 3つの かずでも ひいてみたい","ほかの 3つの かずでも、じゅんばんに ひいて こたえを だしてみたいです。"],["もっと おおきい かずでも できるか","もっと おおきい かずでも、3つの かずの ひきざんが できるのか しりたいです。"],["4つの かずでも ひきざんが できるか","4つの かずに なった ときも、じゅんばんに ひけるのか しりたいです。"],["じぶんで ひきざんの おはなしを つくりたい","2かい かずが へる おはなしの もんだいを、じぶんで つくってみたいです。"]]}];
const el=id=>document.getElementById(id);let selected=0;
function screen(n){[1,2,3].forEach(i=>{el('step'+i).hidden=i!==n});window.scrollTo(0,0)}
function button(label,callback){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',callback);return b}
document.querySelectorAll('#first button').forEach(b=>b.addEventListener('click',()=>{
 selected=Number(b.getAttribute('data-choice'));
 el('question').textContent=items[selected].question;
 const box=el('second');box.innerHTML='';
 items[selected].choices.forEach(pair=>box.appendChild(button(pair[0],()=>{
 el('result').textContent=pair[1];screen(3);
 })));
 screen(2);
}));
el('back1').addEventListener('click',()=>screen(1));el('back2').addEventListener('click',()=>screen(2));el('home').addEventListener('click',()=>screen(1));el('voice').addEventListener('click',()=>{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(el('result').textContent);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}});
screen(1);
})();
</script></body></html>
